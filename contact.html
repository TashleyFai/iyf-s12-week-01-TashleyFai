    <main>
        <section>
            <h2>Send Me a Message</h2>

            <form action="#" method="post">
                <fieldset>
                    <legend>Contact Information</legend>

                    <p>
                        <label for="name">Full Name (required):</label><br>
                        <input type="text" id="name" name="name" required>
                    </p>

                    <p>
                        <label for="email">Email Address (required):</label><br>
                        <input type="email" id="email" name="email" required>
                    </p>

                    <p>
                        <label for="phone">Phone Number (optional):</label><br>
                        <input type="tel" id="phone" name="phone">
                    </p>

                    <p>
                        <label for="subject">Subject:</label><br>
                        <select id="subject" name="subject">
                            <option value="">Choose a subject</option>
                            <option value="general">General Question</option>
                            <option value="feedback">Feedback</option>
                            <option value="support">Support</option>
                        </select>
                    </p>

                    <p>
                        <label for="message">Message (at least 50 characters):</label><br>
                        <textarea id="message" name="message"
                            minlength="50" required></textarea>
                    </p>

                    <p>
                        <input type="checkbox" id="newsletter" name="newsletter">
                        <label for="newsletter">Subscribe to my newsletter</label>
                    </p>

                    <button type="submit">Send Message</button>
                </fieldset>
            </form>
        </section>
