<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 4 - Photo Gallery</title>
    <style>
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        figure {
            margin: 0;
        }

        img {
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <header>
        <h1>My Photo Gallery</h1>
        <p>A collection of placeholder images.</p>
    </header>

    <main>
        <section class="gallery">
            <figure>
                <img src="https://placehold.co/300x200?text=Nature"
                     alt="Placeholder for nature">
                <figcaption>Nature</figcaption>
            </figure>

            <figure>
                <img src="https://placehold.co/300x200?text=Technology"
                     alt="Placeholder for technology">
                <figcaption>Technology</figcaption>
            </figure>

            <figure>
                <img src="https://placehold.co/300x200?text=Travel"
                     alt="Placeholder for travel">
                <figcaption>Travel</figcaption>
            </figure>

            <figure>
                <img src="https://placehold.co/300x200?text=Food"
                     alt="Placeholder for food">
                <figcaption>Food</figcaption>
            </figure>

            <figure>
                <img src="https://placehold.co/300x200?text=Art"
                     alt="Placeholder for art">
                <figcaption>Art</figcaption>
            </figure>

            <figure>
                <img src="https://placehold.co/300x200?text=Learning"
                     alt="Placeholder for learning">
                <figcaption>Learning</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Tashley Fai</p>
    </footer>
</body>
</html>
